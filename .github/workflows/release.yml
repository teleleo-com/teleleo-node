name: Release

# Publishes to npm when a GitHub release is published, with npm trusted publishing (no token in the
# repository) and provenance. Set it up once at npmjs.com: package "teleleo" -> Settings -> Trusted
# publisher -> GitHub Actions, organization teleleo-com, repository teleleo-node, workflow release.yml,
# environment npm.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public
